# GoReleaser configuration: https://goreleaser.com
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: ccdeck
    main: .
    binary: ccdeck
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/DanielTso/ccdeck/cmd.version={{.Version}}
      - -X github.com/DanielTso/ccdeck/cmd.commit={{.ShortCommit}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
